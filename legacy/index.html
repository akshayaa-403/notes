<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="wordmark">Notes</span>
    <div class="board-tabs" id="boardTabs"></div>
    <button class="icon-btn" id="addBoardBtn" title="New board">+</button>
  </div>

  <div class="topbar-right">
    <div class="segmented" id="layoutToggle" role="tablist" aria-label="Layout">
      <button data-layout="canvas"  role="tab" title="Free canvas">Canvas</button>
      <button data-layout="grid"    role="tab" title="Masonry grid">Grid</button>
      <button data-layout="columns" role="tab" title="Columns">Columns</button>
    </div>

    <div class="menu-wrap">
      <button class="btn primary" id="addCardBtn">New</button>
      <div class="menu" id="addCardMenu" hidden></div>
    </div>

    <button class="icon-btn" id="calendarBtn" title="Calendar">&#128197;</button>
    <button class="icon-btn" id="pomodoroBtn" title="Pomodoro timer">&#9201;</button>
    <button class="icon-btn" id="themeBtn" title="Toggle theme">&#9789;</button>
  </div>
</header>

<main id="board" class="board"></main>

<!-- Calendar view: fills the canvas area, replacing the board while open -->
<section class="calendar-view" id="calendarView" hidden>
  <div class="cal-bar">
    <button class="icon-btn" id="calPrev" title="Previous month">&#8249;</button>
    <h2 class="cal-month" id="calMonth"></h2>
    <button class="icon-btn" id="calNext" title="Next month">&#8250;</button>
    <button class="btn" id="calToday">Today</button>
    <span class="cal-spacer"></span>
    <button class="icon-btn" id="calClose" title="Back to board">&times;</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="cal-warn" id="calWarn" hidden></div>
</section>

<div class="empty-state" id="emptyState" hidden>
  <p>Nothing here yet.</p>
  <p class="muted">Hit <strong>New</strong> to add your first card.</p>
</div>

<!-- Pomodoro widget: floating, independent of the card system -->
<section class="pomodoro" id="pomodoro" hidden>
  <div class="pomo-head" id="pomoDrag">
    <span class="pomo-title">Pomodoro</span>
    <button class="icon-btn sm" id="pomoClose" title="Hide">&times;</button>
  </div>
  <div class="pomo-modes" id="pomoModes">
    <button data-mode="focus" class="active">Focus</button>
    <button data-mode="short">Short</button>
    <button data-mode="long">Long</button>
  </div>
  <div class="pomo-time" id="pomoTime">25:00</div>
  <div class="pomo-actions">
    <button class="btn primary" id="pomoStart">Start</button>
    <button class="btn" id="pomoReset">Reset</button>
  </div>
  <div class="pomo-count" id="pomoCount">0 completed</div>
</section>

<script src="app.js"></script>
</body>
</html>
